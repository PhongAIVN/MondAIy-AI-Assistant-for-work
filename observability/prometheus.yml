global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: p004-backend
    metrics_path: /metrics
    static_configs:
      - targets: [p004-backend:8000]
        labels: {service: p004-backend, env: production}

  - job_name: github-actions
    scrape_interval: 30s
    static_configs:
      - targets: [github-actions-exporter:9999]
        labels: {service: github-actions, env: production}

  - job_name: node
    static_configs:
      - targets: [node-exporter:9100]
        labels: {service: vm, env: production}

  - job_name: containers
    static_configs:
      - targets: [cadvisor:8080]
        labels: {service: docker, env: production}

  - job_name: prometheus
    metrics_path: /prometheus/metrics
    static_configs:
      - targets: [localhost:9090]
