<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1760 980" font-family="Georgia, 'Times New Roman', serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1f2933"/>
    </marker>
    <marker id="arrowDash" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#6b7280"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1760" height="980" fill="#ffffff"/>

  <!-- Title -->
  <text x="880" y="40" text-anchor="middle" font-size="24" font-weight="700" fill="#111827">mondaiy — Kiến trúc Data Pipeline</text>
  <text x="880" y="64" text-anchor="middle" font-size="14" fill="#4b5563" font-style="italic">Trợ lý AI cá nhân làm việc trên nguồn người dùng cho phép (Gate 2 architecture, xác nhận lại từ src/agents/pipeline/graph.py)</text>

  <!-- Stage labels -->
  <text x="155" y="112" text-anchor="middle" font-size="13" font-weight="700" fill="#334155">① NGUỒN</text>
  <text x="450" y="112" text-anchor="middle" font-size="13" font-weight="700" fill="#334155">② INGESTION PIPELINE (LangGraph)</text>
  <text x="1005" y="112" text-anchor="middle" font-size="13" font-weight="700" fill="#334155">③ LƯU TRỮ</text>
  <text x="1300" y="112" text-anchor="middle" font-size="13" font-weight="700" fill="#334155">④ SỬ DỤNG</text>

  <!-- ===== Stage 1: Sources ===== -->
  <g>
    <rect x="40" y="130" width="230" height="270" rx="8" fill="#f8fafc" stroke="#334155" stroke-width="1.75"/>
    <text x="155" y="156" text-anchor="middle" font-size="13" fill="#111827" font-weight="600">Connector đã cài</text>
    <text x="155" y="180" text-anchor="middle" font-size="12" fill="#374151">Gmail</text>
    <text x="155" y="198" text-anchor="middle" font-size="12" fill="#374151">Google Calendar</text>
    <text x="155" y="216" text-anchor="middle" font-size="12" fill="#374151">Google Docs / Drive / Sheets</text>
    <text x="155" y="234" text-anchor="middle" font-size="12" fill="#374151">Discord</text>
    <text x="155" y="252" text-anchor="middle" font-size="12" fill="#374151">Slack</text>
    <text x="155" y="270" text-anchor="middle" font-size="12" fill="#374151">Jira</text>
    <text x="155" y="288" text-anchor="middle" font-size="12" fill="#374151">Outlook</text>
    <text x="155" y="306" text-anchor="middle" font-size="12" fill="#374151">Telegram (chat + channel)</text>
    <text x="155" y="324" text-anchor="middle" font-size="12" fill="#374151">Program calendar (.ics feed)</text>
    <text x="155" y="352" text-anchor="middle" font-size="10.5" fill="#6b7280" font-style="italic">src/connectors/*.py — opt-in OAuth,</text>
    <text x="155" y="368" text-anchor="middle" font-size="10.5" fill="#6b7280" font-style="italic">quét theo permission scope</text>
    <rect x="55" y="378" width="200" height="18" rx="3" fill="#dcfce7" stroke="#16a34a" stroke-width="1"/>
    <text x="155" y="391" text-anchor="middle" font-size="10" fill="#166534">auto_sync · SourceCursor (delta)</text>
  </g>

  <!-- Arrow 1->2 -->
  <line x1="270" y1="265" x2="316" y2="265" stroke="#1f2933" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- ===== Stage 2: Ingestion pipeline chain ===== -->
  <g font-size="11" font-weight="600" fill="#111827">
    <!-- fetch -->
    <rect x="320" y="150" width="100" height="46" rx="6" fill="#f8fafc" stroke="#334155" stroke-width="1.5"/>
    <text x="370" y="177" text-anchor="middle">fetch</text>
    <!-- normalize -->
    <rect x="320" y="212" width="100" height="46" rx="6" fill="#f8fafc" stroke="#334155" stroke-width="1.5"/>
    <text x="370" y="239" text-anchor="middle">normalize</text>
    <!-- filter -->
    <rect x="320" y="274" width="100" height="46" rx="6" fill="#f8fafc" stroke="#334155" stroke-width="1.5"/>
    <text x="370" y="301" text-anchor="middle">filter</text>
    <!-- evidence -->
    <rect x="320" y="336" width="100" height="46" rx="6" fill="#ccfbf1" stroke="#0d9488" stroke-width="1.5"/>
    <text x="370" y="359" text-anchor="middle" fill="#0d9488">evidence</text>
    <text x="370" y="373" text-anchor="middle" font-size="9" font-weight="400" fill="#0f766e">gắn provenance</text>

    <line x1="370" y1="196" x2="370" y2="208" stroke="#1f2933" stroke-width="1.5" marker-end="url(#arrow)"/>
    <line x1="370" y1="258" x2="370" y2="270" stroke="#1f2933" stroke-width="1.5" marker-end="url(#arrow)"/>
    <line x1="370" y1="320" x2="370" y2="332" stroke="#1f2933" stroke-width="1.5" marker-end="url(#arrow)"/>

    <!-- attachment_extract -->
    <rect x="320" y="398" width="100" height="46" rx="6" fill="#f8fafc" stroke="#334155" stroke-width="1.5"/>
    <text x="370" y="421" text-anchor="middle" font-size="10">attachment</text>
    <text x="370" y="434" text-anchor="middle" font-size="10">_extract</text>
    <line x1="370" y1="382" x2="370" y2="394" stroke="#1f2933" stroke-width="1.5" marker-end="url(#arrow)"/>
  </g>

  <!-- Route gate after attachment_extract -->
  <polygon points="480,421 545,398 610,421 545,444" fill="#fee2e2" stroke="#dc2626" stroke-width="1.75"/>
  <text x="545" y="416" text-anchor="middle" font-size="9.5" fill="#7f1d1d" font-weight="700">route_after</text>
  <text x="545" y="428" text-anchor="middle" font-size="9.5" fill="#7f1d1d" font-weight="700">_filter</text>
  <line x1="420" y1="421" x2="476" y2="421" stroke="#1f2933" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Branch A: summary (short-circuit) -->
  <rect x="480" y="150" width="130" height="50" rx="6" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/>
  <text x="545" y="171" text-anchor="middle" font-size="11" font-weight="600" fill="#1e3a8a">summary</text>
  <text x="545" y="186" text-anchor="middle" font-size="9.5" fill="#1e40af">tóm tắt · KHÔNG tạo task</text>
  <path d="M 545 398 C 545 300, 545 250, 545 200" fill="none" stroke="#1f2933" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="600" y="300" font-size="10" fill="#6b7280">"summary"</text>

  <!-- Branch B: task extraction chain -->
  <g font-size="10.5" font-weight="600" fill="#111827">
    <rect x="640" y="398" width="105" height="46" rx="6" fill="#f8fafc" stroke="#334155" stroke-width="1.5"/>
    <text x="692" y="418" text-anchor="middle" font-size="10">make_batches</text>
    <text x="692" y="431" text-anchor="middle" font-size="9" font-weight="400" fill="#6b7280">→ extract_batch</text>
    <line x1="610" y1="421" x2="636" y2="421" stroke="#1f2933" stroke-width="1.5" marker-end="url(#arrow)"/>
    <text x="620" y="410" font-size="9.5" fill="#6b7280">"task_extraction"</text>

    <rect x="760" y="398" width="90" height="46" rx="6" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/>
    <text x="805" y="418" text-anchor="middle" font-size="10" fill="#1e3a8a">verify</text>
    <text x="805" y="431" text-anchor="middle" font-size="8.5" font-weight="400" fill="#1e40af">LLM extract</text>
    <line x1="745" y1="421" x2="756" y2="421" stroke="#1f2933" stroke-width="1.5" marker-end="url(#arrow)"/>

    <rect x="865" y="398" width="80" height="46" rx="6" fill="#f8fafc" stroke="#334155" stroke-width="1.5"/>
    <text x="905" y="418" text-anchor="middle" font-size="10">resolve</text>
    <text x="905" y="431" text-anchor="middle" font-size="8.5" font-weight="400" fill="#6b7280">deadline/assignee</text>
    <line x1="850" y1="421" x2="861" y2="421" stroke="#1f2933" stroke-width="1.5" marker-end="url(#arrow)"/>
  </g>

  <!-- cluster -> reduce -> persist wraps down -->
  <g font-size="10.5" font-weight="600" fill="#111827">
    <line x1="905" y1="444" x2="905" y2="470" stroke="#1f2933" stroke-width="1.5"/>
    <line x1="905" y1="470" x2="692" y2="470" stroke="#1f2933" stroke-width="1.5"/>
    <line x1="692" y1="470" x2="692" y2="488" stroke="#1f2933" stroke-width="1.5" marker-end="url(#arrow)"/>

    <rect x="617" y="492" width="90" height="42" rx="6" fill="#f8fafc" stroke="#334155" stroke-width="1.5"/>
    <text x="662" y="518" text-anchor="middle" font-size="10">cluster</text>

    <line x1="707" y1="513" x2="753" y2="513" stroke="#1f2933" stroke-width="1.5" marker-end="url(#arrow)"/>
    <rect x="757" y="492" width="90" height="42" rx="6" fill="#f8fafc" stroke="#334155" stroke-width="1.5"/>
    <text x="802" y="518" text-anchor="middle" font-size="10">reduce</text>

    <line x1="847" y1="513" x2="893" y2="513" stroke="#1f2933" stroke-width="1.5" marker-end="url(#arrow)"/>
    <rect x="897" y="492" width="90" height="42" rx="6" fill="#ccfbf1" stroke="#0d9488" stroke-width="1.5"/>
    <text x="942" y="518" text-anchor="middle" font-size="10" fill="#0d9488">persist</text>
  </g>
  <text x="750" y="558" text-anchor="middle" font-size="10.5" fill="#374151" font-style="italic">nguồn: src/agents/pipeline/graph.py — thứ tự node xác nhận từ code, không suy đoán</text>

  <!-- Arrow into stores -->
  <line x1="987" y1="513" x2="1033" y2="513" stroke="#1f2933" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- ===== Stage 3: Stores ===== -->
  <g font-size="11.5" font-weight="600">
    <path d="M 1040 145 a 25 10 0 0 1 50 0 v 70 a 25 10 0 0 1 -50 0 z" fill="#ccfbf1" stroke="#0d9488" stroke-width="1.5"/>
    <ellipse cx="1065" cy="145" rx="25" ry="10" fill="#99f6e4" stroke="#0d9488" stroke-width="1.5"/>
    <text x="1065" y="240" text-anchor="middle" fill="#111827">Evidence store</text>

    <path d="M 1040 260 a 25 10 0 0 1 50 0 v 60 a 25 10 0 0 1 -50 0 z" fill="#ccfbf1" stroke="#0d9488" stroke-width="1.5"/>
    <ellipse cx="1065" cy="260" rx="25" ry="10" fill="#99f6e4" stroke="#0d9488" stroke-width="1.5"/>
    <text x="1065" y="345" text-anchor="middle" fill="#111827">Runs + audit</text>

    <path d="M 1040 365 a 25 10 0 0 1 50 0 v 60 a 25 10 0 0 1 -50 0 z" fill="#ccfbf1" stroke="#0d9488" stroke-width="1.5"/>
    <ellipse cx="1065" cy="365" rx="25" ry="10" fill="#99f6e4" stroke="#0d9488" stroke-width="1.5"/>
    <text x="1065" y="450" text-anchor="middle" fill="#111827">Tasks + calendar</text>

    <path d="M 1040 470 a 25 10 0 0 1 50 0 v 60 a 25 10 0 0 1 -50 0 z" fill="#ccfbf1" stroke="#0d9488" stroke-width="1.5"/>
    <ellipse cx="1065" cy="470" rx="25" ry="10" fill="#99f6e4" stroke="#0d9488" stroke-width="1.5"/>
    <text x="1065" y="555" text-anchor="middle" fill="#111827" font-size="10.5">Conversation + memory</text>
  </g>
  <text x="1065" y="600" text-anchor="middle" font-size="10" fill="#6b7280" font-style="italic">src/models/*.py — PostgreSQL/SQLite,</text>
  <text x="1065" y="614" text-anchor="middle" font-size="10" fill="#6b7280" font-style="italic">FTS + pgvector cho memory</text>

  <!-- ===== Stage 4: Consumption ===== -->
  <line x1="1090" y1="180" x2="1136" y2="150" stroke="#1f2933" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="1090" y1="290" x2="1136" y2="245" stroke="#1f2933" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="1090" y1="500" x2="1136" y2="340" stroke="#1f2933" stroke-width="1.5" marker-end="url(#arrow)"/>

  <rect x="1140" y="120" width="220" height="60" rx="7" fill="#f3e8ff" stroke="#a855f7" stroke-width="1.75"/>
  <text x="1250" y="144" text-anchor="middle" font-size="13" fill="#581c87" font-weight="700">Ask agent</text>
  <text x="1250" y="160" text-anchor="middle" font-size="10.5" fill="#6b21a8">grounded QA · trích dẫn nguồn</text>
  <text x="1250" y="174" text-anchor="middle" font-size="9.5" fill="#6b21a8">abstain nếu thiếu evidence</text>

  <rect x="1140" y="215" width="220" height="60" rx="7" fill="#f3e8ff" stroke="#a855f7" stroke-width="1.75"/>
  <text x="1250" y="239" text-anchor="middle" font-size="13" fill="#581c87" font-weight="700">Brief + notification</text>
  <text x="1250" y="255" text-anchor="middle" font-size="10.5" fill="#6b21a8">tổng hợp hằng ngày</text>
  <text x="1250" y="269" text-anchor="middle" font-size="9.5" fill="#6b21a8">web push · Telegram delivery</text>

  <rect x="1140" y="310" width="220" height="60" rx="7" fill="#f3e8ff" stroke="#a855f7" stroke-width="1.75"/>
  <text x="1250" y="334" text-anchor="middle" font-size="13" fill="#581c87" font-weight="700">Approved action</text>
  <text x="1250" y="350" text-anchor="middle" font-size="10.5" fill="#6b21a8">task / calendar draft</text>
  <text x="1250" y="364" text-anchor="middle" font-size="9.5" fill="#b45309" font-weight="600">chờ user duyệt trước khi ghi</text>

  <!-- Approval + Auth gate -->
  <polygon points="1400,325 1465,300 1530,325 1465,350" fill="#fee2e2" stroke="#dc2626" stroke-width="1.75"/>
  <text x="1465" y="320" text-anchor="middle" font-size="10" fill="#7f1d1d" font-weight="700">User duyệt +</text>
  <text x="1465" y="333" text-anchor="middle" font-size="10" fill="#7f1d1d" font-weight="700">Auth/scope OK?</text>
  <line x1="1360" y1="340" x2="1396" y2="332" stroke="#1f2933" stroke-width="1.5" marker-end="url(#arrow)"/>

  <rect x="1400" y="365" width="130" height="32" rx="6" fill="#f1f5f9" stroke="#94a3b8" stroke-dasharray="4 3" stroke-width="1.5"/>
  <text x="1465" y="385" text-anchor="middle" font-size="10" fill="#475569">Từ chối — không ghi gì</text>
  <line x1="1465" y1="350" x2="1465" y2="361" stroke="#9ca3af" stroke-width="1.5" stroke-dasharray="4 3" marker-end="url(#arrowDash)"/>

  <rect x="1560" y="309" width="150" height="42" rx="6" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.5"/>
  <text x="1635" y="326" text-anchor="middle" font-size="11" fill="#4c1d95" font-weight="600">FastAPI ghi</text>
  <text x="1635" y="340" text-anchor="middle" font-size="9.5" fill="#5b21b6">Google Calendar / task</text>
  <line x1="1530" y1="325" x2="1556" y2="325" stroke="#1f2933" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- User node -->
  <circle cx="1465" cy="640" r="42" fill="#ecfdf5" stroke="#10b981" stroke-width="2"/>
  <text x="1465" y="635" text-anchor="middle" font-size="12" fill="#065f46" font-weight="700">Người</text>
  <text x="1465" y="652" text-anchor="middle" font-size="12" fill="#065f46" font-weight="700">dùng</text>
  <text x="1465" y="700" text-anchor="middle" font-size="10.5" fill="#6b7280" font-style="italic">Web App · browser extension · Telegram bot</text>

  <path d="M 1250 180 C 1250 400, 1350 500, 1440 610" fill="none" stroke="#1f2933" stroke-width="1.5" marker-end="url(#arrow)"/>
  <path d="M 1250 275 C 1280 400, 1330 500, 1440 620" fill="none" stroke="#1f2933" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="1465" y1="351" x2="1465" y2="596" stroke="#1f2933" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Feedback loop -->
  <path d="M 1423 650 C 900 830, 545 830, 545 208" fill="none" stroke="#6b7280" stroke-width="1.75" stroke-dasharray="6 4" marker-end="url(#arrowDash)"/>
  <text x="960" y="820" text-anchor="middle" font-size="12" fill="#4b5563" font-style="italic">⑤ Feedback (đúng · sai · huỷ) — feedback_quality.py, learning.py cải thiện routing/extraction</text>

  <!-- Legend -->
  <g transform="translate(40,900)">
    <rect x="0" y="0" width="16" height="16" fill="#fee2e2" stroke="#dc2626" stroke-width="1.5"/>
    <text x="22" y="13" font-size="11.5" fill="#374151">Cổng kiểm soát (routing / approval)</text>

    <rect x="280" y="0" width="16" height="16" fill="#ccfbf1" stroke="#0d9488" stroke-width="1.5"/>
    <text x="302" y="13" font-size="11.5" fill="#374151">Lưu trữ / bước gắn provenance</text>

    <rect x="540" y="0" width="16" height="16" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/>
    <text x="562" y="13" font-size="11.5" fill="#374151">Bước gọi LLM</text>

    <rect x="720" y="0" width="16" height="16" fill="#f3e8ff" stroke="#a855f7" stroke-width="1.5"/>
    <text x="742" y="13" font-size="11.5" fill="#374151">Điểm tiêu thụ dữ liệu</text>

    <line x1="920" y1="8" x2="956" y2="8" stroke="#6b7280" stroke-width="1.75" stroke-dasharray="6 4"/>
    <text x="962" y="13" font-size="11.5" fill="#374151">Vòng phản hồi</text>
  </g>

  <text x="880" y="960" text-anchor="middle" font-size="12" fill="#6b7280">Hình 1. Data pipeline của mondaiy, xác nhận trực tiếp từ README.md, src/agents/pipeline/graph.py, src/connectors/ và docs Gate 2 (2026-08-24).</text>
</svg>
