<style>
        body {
            background-color: #f4faff;
            color: #001f2a;
            font-family: 'Geist', sans-serif;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
        }
        .extension-panel {
            width: 100%;
            max-width: 400px;
            background-color: #f4faff;
            position: relative;
            box-shadow: 0 25px 50px -12px rgba(35,64,77,0.1);
            border-radius: 12px;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            height: 800px; /* Fixed height for extension feel */
        }
        
        /* Checkbox Styling */
        .task-checkbox {
            appearance: none;
            width: 20px;
            height: 20px;
            border: 1.5px solid #70787c;
            border-radius: 4px;
            display: grid;
            place-content: center;
            transition: all 0.2s ease-in-out;
            cursor: pointer;
            background-color: transparent;
        }
        .task-checkbox::before {
            content: "";
            width: 12px;
            height: 12px;
            transform: scale(0);
            transition: 120ms transform ease-in-out;
            box-shadow: inset 1em 1em #16576a;
            background-color: #16576a;
            transform-origin: center;
            clip-path: polygon(14% 44%, 0 65%, 50% 100%, 100% 16%, 80% 0%, 43% 62%);
        }
        .task-checkbox:checked {
            border-color: #16576a;
        }
        .task-checkbox:checked::before {
            transform: scale(1);
        }

        /* Task Card Hover/Active States */
        .task-card {
            transition: all 0.2s ease;
            border: 1px solid transparent;
        }
        .task-card:hover {
            border-color: #c9e7f8;
            background-color: #ffffff;
            box-shadow: 0 2px 4px rgba(35,64,77,0.05), 0 8px 16px rgba(35,64,77,0.08);
            transform: translateY(-1px);
        }
        
        /* Custom Scrollbar */
        .scrollable-content {
            overflow-y: auto;
            flex-grow: 1;
        }
        .scrollable-content::-webkit-scrollbar {
            width: 6px;
        }
        .scrollable-content::-webkit-scrollbar-track {
            background: transparent;
        }
        .scrollable-content::-webkit-scrollbar-thumb {
            background-color: #c0c8cc;
            border-radius: 10px;
        }
    </style>
</head>
